; ESP32-2432S028 (CYD) — tabby-touch
; Dokunmatik tus takimi: kod -> Giris/Cikis

; Sabit cekirdek: platformio/espressif32 8.0.0 = Arduino-ESP32 3.3.12 (IDF 5.5).
; Sahipsiz "espressif32" yerelde pioarduino fork'una kayabilir; sahip ve surum
; yazili. Saha 1.2.0 bu cekirdekle uretildi, 1.2.1 de ayni hatta kalir.
; Sunucunun Arduino-ESP32 2.0.17 ortami: env esp32-2432S028-core2017
; (platformio/espressif32 6.12.0). mmap adlari include/tabby_mmap.h icinde;
; -D esp_partition_mmap_handle_t / ESP_PARTITION_MMAP_DATA / esp_partition_munmap
; bayraklari gerekmez ve 8.0.0 uzerinde kullanilmamalidir.

[env:esp32-2432S028]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  nitek/XPT2046_Bitbang_Slim @ ^2.0.0
  bblanchon/ArduinoJson @ ^7.3.0
  ricmoo/QRCode @ ^0.0.1
  knolleary/PubSubClient @ ^2.8

; TABBY_SITE: 0 Izmir (10.85.1.77), 1 Kocaeli (10.241.1.77)
; TABBY_HTTP_FALLBACK: 1 iken MQTT yaninda eski HTTPS yolu da calisir.

build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DTABBY_SITE=0
  -DTABBY_HTTP_FALLBACK=1
  -Isrc/vendor

[env:esp32-2432S028-core2017]
extends = env:esp32-2432S028
platform = platformio/espressif32@6.12.0
